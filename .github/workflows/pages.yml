# 가이드 사이트(site/)를 GitHub Pages 프로젝트 주소(https://ring-wdr.github.io/aws-newbie-guide/)에 배포한다.
# - main 에 푸시될 때와 수동 실행(workflow_dispatch) 때 돈다. 저장소 비밀값은 쓰지 않는다(GITHUB_TOKEN 의 OIDC 토큰만).
# - 하위 경로(base)로 빌드한다: configure-pages 가 알려 주는 base_path("/aws-newbie-guide")를 GUIDE_BASE 로 넘긴다
#   (site/src/lib/base.mjs). 사용자 지정 도메인을 붙이면 base_path 가 비어 루트로 빌드된다.
# - 배포 전에 브라우저가 필요 없는 관문(parity·links·static·grades·quiz·exam·widgets)과 브라우저 관문 diagrams 를 돌리고,
#   하나라도 실패하면 배포하지 않는다. 그 밖의 브라우저 관문(offline·a11y·keyboard·tables)은 PR 검증에서 돈다(GUIDE-SITE 5장).
# - 액션은 태그가 아니라 전체 커밋 SHA 로 고정한다(주석은 그 SHA 의 릴리스 태그).
name: 가이드 사이트 배포 (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

# 권한은 작업마다 최소로: 워크플로 기본은 아무것도 주지 않고(build 는 서드파티 패키지 설치·빌드 코드가 도는 작업이라
# 배포 토큰을 요청할 수 없게), 배포 권한(pages: write, id-token: write)은 deploy 작업에만 준다.
permissions: {}

# 배포가 겹치지 않게 한 번에 하나만. 진행 중인 배포는 끊지 않고 끝낸다(새 실행은 기다린다).
concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  ASTRO_DISABLE_UPDATE_CHECK: 'true'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # configure-pages 는 Pages 사이트 정보를 읽기만 한다(enablement: false — octokit repos.getPages = GET /repos/{owner}/{repo}/pages,
    # REST 문서상 "Pages" 저장소 권한 read). 그래서 pages: read 만 더한다.
    permissions:
      contents: read
      pages: read
    steps:
      - name: 저장소 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pages 설정 읽기(base 경로)
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: pnpm 준비
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.14.0
          package_json_file: site/package.json

      - name: Node 준비
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: 패키지 설치(lockfile 고정)
        working-directory: site
        run: pnpm install --frozen-lockfile

      # Mermaid 그림은 빌드 때 Playwright 헤드리스 Chromium(chromium-headless-shell)으로 그린다(site/src/plugins/mermaid-render.mjs).
      # pnpm install 은 브라우저를 받지 않는다. lockfile 에 고정된 playwright 버전의 것만 받고, 그 버전을 키로 캐시한다.
      - name: Playwright 버전 읽기
        id: pw
        working-directory: site
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 헤드리스 Chromium 캐시
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium-headless-shell

      # 그림 글자 폭은 사이트에 실은 다이어그램 글꼴(site/src/plugins/diagram-font.mjs — Noto Sans KR 부분집합)로 잰다.
      # 시스템 한국어 글꼴(fonts-noto-cjk)은 그 글꼴을 못 받았을 때의 대체 글꼴 검사(diagrams 관문)와 본문용으로 둔다.
      # 캐시가 있으면 브라우저는 다시 받지 않고 시스템 라이브러리(--with-deps)만 설치한다.
      - name: 빌드용 브라우저와 한국어 글꼴 설치
        working-directory: site
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          pnpm exec playwright install --with-deps chromium-headless-shell

      - name: 사이트 빌드(base ${{ steps.pages.outputs.base_path }}/)
        working-directory: site
        env:
          GUIDE_BASE: ${{ steps.pages.outputs.base_path }}
        run: pnpm run build

      - name: 배포 전 관문(브라우저 없음)
        env:
          GUIDE_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          set -e
          for gate in parity links static grades quiz exam widgets; do
            echo "::group::sitecheck $gate"
            python3 tools/sitecheck/sitecheck.py "$gate" --pages all
            echo "::endgroup::"
          done

      # 다이어그램 관문(브라우저): 라벨 잘림·겹침, 실린 글꼴로 그려지는지, 그 글꼴을 막아도 잘려서 사라지는 글자가 없는지,
      # 단독 SVG. 그림이 있는 페이지만이 아니라 전 페이지를 본다(로컬 측정 약 1분).
      - name: 배포 전 관문(diagrams, 브라우저)
        env:
          GUIDE_BASE: ${{ steps.pages.outputs.base_path }}
        run: python3 tools/sitecheck/sitecheck.py diagrams --pages all --port 4321

      - name: 산출물 올리기
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages 에 배포
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
