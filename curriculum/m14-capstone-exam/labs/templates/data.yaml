# TodayOrder 캡스톤 — 데이터·보안 계층
#   KMS 고객 관리형 키(자동 교체) + 별칭
#   DynamoDB 주문 테이블: 파티션 키 orderId, GSI byCustomer(customerId + createdAt), 온디맨드, PITR, SSE-KMS
#   Secrets Manager: 결제 대행사 API 키 (KMS 키로 암호화)
#   Parameter Store: 앱 설정 (비밀이 아닌 값)
# 영수증 S3 버킷은 이 템플릿에 넣지 않는다 — 에뮬레이터 1.0.322의 CloudFormation이 BucketEncryption 속성을
# 적용하지 않아(기본 SSE-S3로 남음) lab02가 CLI로 만든다(README "에뮬레이터 제약").
AWSTemplateFormatVersion: "2010-09-09"
Description: TodayOrder capstone - data and security
Parameters:
  Prefix:
    Type: String
    Default: todayorder-cap
Resources:
  DataKey:
    Type: AWS::KMS::Key
    Properties:
      Description: TodayOrder capstone data key (orders table, receipts, secrets)
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          # 계정 루트에 키 관리를 위임 = 이 키에 대한 권한을 IAM 정책으로 줄 수 있게 한다
          - Sid: EnableIamPolicies
            Effect: Allow
            Principal: {AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"}
            Action: "kms:*"
            Resource: "*"
      Tags: [{Key: Project, Value: todayorder}]
  DataKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${Prefix}-data"
      TargetKeyId: !Ref DataKey

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${Prefix}-orders"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: orderId, AttributeType: S}
        - {AttributeName: customerId, AttributeType: S}
        - {AttributeName: createdAt, AttributeType: S}
      KeySchema:
        - {AttributeName: orderId, KeyType: HASH}
      GlobalSecondaryIndexes:
        - IndexName: byCustomer
          KeySchema:
            - {AttributeName: customerId, KeyType: HASH}
            - {AttributeName: createdAt, KeyType: RANGE}
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes: [status, total]
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true, SSEType: KMS, KMSMasterKeyId: !Ref DataKey}
      Tags: [{Key: Project, Value: todayorder}, {Key: Backup, Value: daily}]

  PaymentGatewaySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${Prefix}/payment-gateway"
      Description: payment gateway API key (rotated by the payment team)
      KmsKeyId: !Ref DataKey
      GenerateSecretString:
        SecretStringTemplate: '{"merchantId": "todayorder-test"}'
        GenerateStringKey: apiKey
        PasswordLength: 32
        ExcludePunctuation: true
      Tags: [{Key: Project, Value: todayorder}]

  MaxItemsParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /todayorder-cap/order/max-items
      Type: String
      Value: "20"
      Description: max line items per order
  CurrencyParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /todayorder-cap/order/currency
      Type: String
      Value: KRW
Outputs:
  KeyArn: {Value: !GetAtt DataKey.Arn}
  TableName: {Value: !Ref OrdersTable}
  TableArn: {Value: !GetAtt OrdersTable.Arn}
  SecretArn: {Value: !Ref PaymentGatewaySecret}
